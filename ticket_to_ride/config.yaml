# Home Assistant app configuration for Ticket to Ride Scorer
# Docs: https://developers.home-assistant.io/docs/apps/configuration
name: Ticket to Ride Scorer
version: "0.1.3"
slug: ticket_to_ride
description: >-
  Final scores for the board game Ticket to Ride, from your phone. Photograph
  the board and each player's tickets, check what was read, and get everyone's
  score: routes, tickets, longest route and stations. USA and Europe maps.
url: https://github.com/chris-standley/home-assistant-apps/tree/main/ticket_to_ride
arch:
  - aarch64
  - amd64

startup: application
boot: auto
init: true

# Open it from the Home Assistant sidebar or the Companion app (ingress: signed
# in, works away from home). The direct port is off by default because it has
# no login; turn it on to save the page to an iPhone home screen on your LAN.
ingress: true
ingress_port: 8099
panel_icon: mdi:train-car
panel_title: Ticket to Ride
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direct access on your network, without a Home Assistant login (optional)

# Home Assistant API: ask Home Assistant's AI (an AI Task entity) to read the
# photos. Photos are put in /media for a moment so the AI can be given them,
# then deleted.
homeassistant_api: true
map:
  - type: media
    read_only: false
    path: /media

options:
  log_level: info
schema:
  ai_task_entity: str?
  log_level: list(debug|info|warning|error)
