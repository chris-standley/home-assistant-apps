# Home Assistant app configuration for Immich Memories
# Docs: https://developers.home-assistant.io/docs/apps/configuration
name: Immich Memories
version: "0.1.7"
slug: immich_memories
description: >-
  Apple Photos style memories for Immich. Finds trips, days out, holidays,
  birthdays and busy days, picks the best photos (no screenshots or receipts),
  stacks near-identical shots and makes friendly-named albums, plus
  collections that grow each year (Christmas, Holidays in Norway...).
url: https://github.com/chris-standley/home-assistant-apps/tree/main/immich_memories
arch:
  - aarch64
  - amd64

startup: application
boot: auto
# A background job with no web UI or ports: it talks to Immich's API and runs
# once a day.
init: true

# Supervisor API: find the Immich app on this server.
hassio_api: true
# Home Assistant API: home location, time zone and country (for trips and
# public holidays), and the configured AI for polishing album names.
homeassistant_api: true

options:
  immich_api_key: ""
  verify_ssl: true
  run_time: "03:30"
  run_on_start: true
  dry_run: false
  ai_names: true
  create_stacks: true
  similar_photos: normal
  max_photos_per_album: 50
  max_albums_per_run: 20
  min_photos_trip: 15
  min_photos_holiday: 10
  min_photos_spike: 25
  spike_factor: 3
  home_radius_km: 40
  exclude_people_from_names: []
  collections: true
  min_memories_for_collection: 2
  remove_created: false
  log_level: info
schema:
  immich_url: url?
  immich_ip: match(^[0-9a-fA-F:.]+$)?
  verify_ssl: bool
  immich_api_key: password
  run_time: match(^([01]?[0-9]|2[0-3]):[0-5][0-9]$)
  run_on_start: bool
  dry_run: bool
  ai_names: bool
  ai_task_entity: str?
  conversation_agent: str?
  create_stacks: bool
  similar_photos: list(light|normal|strong)
  max_photos_per_album: int(5,500)
  max_albums_per_run: int(0,1000)
  min_photos_trip: int(3,1000)
  min_photos_holiday: int(3,1000)
  min_photos_spike: int(5,5000)
  spike_factor: float(1,20)
  home_radius_km: float(1,1000)
  holiday_country: str?
  holiday_subdivision: str?
  exclude_people_from_names:
    - str
  earliest_date: match(^\d{4}-\d{2}-\d{2}$)?
  collections: bool
  min_memories_for_collection: int(2,50)
  remove_created: bool
  log_level: list(debug|info|warning|error)
